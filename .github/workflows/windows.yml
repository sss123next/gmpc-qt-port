# Windows (MSYS2/CLANG64) build workflow
#
# Builds gmpc-qt natively on a Windows runner using MSYS2 with Clang/LLVM,
# CMake/Ninja, and Qt6 from MSYS2 packages.  Runs only on tags (releases).
# On a new tag push, builds the binary, bundles Qt DLLs via windeployqt,
# and attaches the ZIP archive to the GitHub Release.
#
# Trigger:
#   git tag v0.2.0
#   git push origin v0.2.0
#
# Notes on CLANG64 migration (MSYS2 deprecated MINGW64 as of 2026-03-15):
#   - msystem: CLANG64 (LLVM/Clang toolchain, Universal CRT)
#   - Package prefix: mingw-w64-clang-x86_64-*
#   - Path: /clang64 instead of /mingw64
#   - Runtime DLLs: libc++.dll, libc++abi.dll, libunwind.dll
#     (instead of libgcc_s_seh-1.dll, libstdc++-6.dll, libwinpthread-1.dll)

name: Build Windows

on:
  push:
    tags:
      - 'v*'
      - 'gmpc-qt-*'

permissions:
  contents: write

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup MSYS2 / CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-qt6-base
            mingw-w64-clang-x86_64-qt6-svg
            mingw-w64-clang-x86_64-qt6-tools
            mingw-w64-clang-x86_64-curl
            mingw-w64-clang-x86_64-sqlite3
            mingw-w64-clang-x86_64-taglib
            mingw-w64-clang-x86_64-openssl
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-meson
            mingw-w64-clang-x86_64-pkgconf

      # libmpdclient is not packaged in MSYS2 — build from source.
      # NB: Meson on Windows auto-detects MSVC first; force the CLANG64
      # compiler explicitly to avoid building with the wrong toolchain.
      # Note: since v2.18 libmpdclient uses Meson, not CMake.
      - name: Build libmpdclient
        env:
          CC: /clang64/bin/clang
        run: |
          curl -fsSLo /tmp/libmpdclient.tar.xz \
            https://www.musicpd.org/download/libmpdclient/2/libmpdclient-2.27.tar.xz
          tar xJf /tmp/libmpdclient.tar.xz -C /tmp
          meson setup /tmp/libmpdclient-build /tmp/libmpdclient-2.27 \
            --buildtype release \
            --prefix /clang64
          meson install -C /tmp/libmpdclient-build

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build

      - name: Deploy Qt & dependency DLLs
        run: |
          /clang64/bin/windeployqt \
            --compiler-runtime \
            build/gmpc-qt.exe

      # Copy all non-system DLLs recursively to closure.
      # windeployqt deploys Qt DLLs + compiler runtime (libc++ etc.)
      # but NOT transitive dependencies of Qt itself (ICU, zlib, …).
      # This step scans EVERY DLL in build/ (exe + Qt + plugins) and
      # copies any missing DLL — like ldd on Linux.
      #
      # NB: System DLLs (KERNEL32, …) are intentionally excluded.
      - name: Copy dependency DLLs (recursive closure)
        run: |
          : > /tmp/dll_visited.txt
          scan_dll() {
            local dll="$1"
            # normalise: strip leading path
            dll="${dll##*/}"
            case "$dll" in
              KERNEL32*|USER32*|GDI32*|ADVAPI32*|SHELL32*|COMCTL32*| \
              COMDLG32*|OLE32*|OLEAUT32*|WINMM*|WS2_32*|VERSION*| \
              SHLWAPI*|IMM32*|MSVCRT*|UCRTBASE*|API-MS-WIN*|ext-ms-win*| \
              RPCRT4*|SECUR32*|SETUPAPI*|PSAPI*|CRYPT32*|WLDAP32*)
                return ;;
            esac
            grep -qxF "$dll" /tmp/dll_visited.txt 2>/dev/null && return
            echo "$dll" >> /tmp/dll_visited.txt
            # locate source
            local src=""
            if [ -f "/clang64/bin/$dll" ]; then
              src="/clang64/bin/$dll"
            else
              src=$(find /clang64 -name "$dll" -print -quit 2>/dev/null)
            fi
            [ -z "$src" ] && return
            # copy if not already in build/
            if [ ! -f "build/$dll" ]; then
              cp "$src" build/
            fi
            # recurse into its imports
            while IFS= read -r dep; do
              scan_dll "$dep"
            done < <(objdump -p "$src" 2>/dev/null | grep 'DLL Name' | awk '{print $NF}')
          }
          # 1) scan gmpc-qt.exe direct imports
          while IFS= read -r dll; do scan_dll "$dll"; done < <(objdump -p build/gmpc-qt.exe | grep 'DLL Name' | awk '{print $NF}')
          # 2) scan every DLL already placed by windeployqt (Qt + plugins)
          find build/ -name '*.dll' | while IFS= read -r f; do
            scan_dll "$(basename "$f")"
          done

      # Gather everything into a portable ZIP
      - name: Package ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path build/gmpc-qt.exe, build/*.dll, build/platforms, build/styles, build/imageformats, build/iconengines, build/tls -DestinationPath gmpc-qt-windows-x86_64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: gmpc-qt-windows-x86_64
          path: gmpc-qt-windows-x86_64.zip

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          files: gmpc-qt-windows-x86_64.zip
